<!-- Import des polices Sansita -->
<link href="https://fonts.googleapis.com/css2?family=Sansita:wght@400;700&display=swap" rel="stylesheet">

<div class="drawer drawer-end">
  <input id="my-drawer" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content">

    <header class="bg-gradient-to-r from-pink-400 to-pink-500 p-4 shadow-lg" role="banner">
      <div class="max-w-[2000px] mx-auto">
        <!-- Desktop Menu -->
        <div class="hidden md:flex justify-between items-center">
          <div class="flex items-center">
            <span class="text-yellow-400 text-2xl pl-0" aria-hidden="true">✨</span>
            <span class="sr-only">Étoile scintillante, icône décorative du festival</span>
            <a routerLink="/visiteur/home" class="focus:outline-2 focus:outline-white focus:outline-offset-2">
              <h1 class="font-['Sansita',sans-serif] text-white text-4xl font-bold ml-2">Festival Nation Sound</h1>
            </a>
          </div>
          <nav class="pr-4" aria-label="Navigation principale">
            <ul class="menu menu-horizontal space-x-6">
              <li><a routerLink="/visiteur/home" routerLinkActive="active" class="text-white hover:text-pink-100 transition-colors duration-200
              font-['Sansita',sans-serif] focus:outline-2 focus:outline-white focus:outline-offset-2">Accueil</a></li>
              <li><a routerLink="/visiteur/programme" routerLinkActive="active" class="text-white hover:text-pink-100 transition-colors duration-200
              font-['Sansita',sans-serif] focus:outline-2 focus:outline-white focus:outline-offset-2">Programme</a></li>
              <li><a routerLink="/visiteur/map" routerLinkActive="active" class="text-white hover:text-pink-100 transition-colors duration-200
              font-['Sansita',sans-serif] focus:outline-2 focus:outline-white focus:outline-offset-2">Map</a></li>
              <li><a routerLink="/visiteur/faq" routerLinkActive="active" class="text-white hover:text-pink-100 transition-colors duration-200
              font-['Sansita',sans-serif] focus:outline-2 focus:outline-white focus:outline-offset-2">FAQ</a></li>
            </ul>
          </nav>
        </div>

        <!-- Mobile Menu -->
        <div class="md:hidden">
          <div class="flex justify-between items-center">
            <div class="flex items-center">
              <span class="text-yellow-400 text-xl" aria-hidden="true">✨</span>
              <span class="sr-only">Étoile scintillante, icône décorative du festival</span>
              <h1 class="font-['Sansita',sans-serif] text-white text-2xl font-bold ml-2">Festival Nation Sound</h1>
            </div>

            <!-- Bouton du menu mobile avec accessibilité améliorée -->
            <label for="my-drawer" class="btn btn-ghost drawer-button text-white" aria-label="Ouvrir le menu de navigation">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
              <span class="sr-only">Menu</span>
            </label>
          </div>
        </div>
      </div>
    </header>

    <!-- Contenu de  l'application -->
    <div>
      <!-- Contenu de la page -->
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- Drawer pour le menu mobile -->
  <div class="drawer-side z-10">
    <label for="my-drawer" aria-label="Fermer le menu" class="drawer-overlay"></label>
    <div class="menu p-4 w-64 min-h-full bg-pink-500 text-white">
      <div class="flex justify-end">
        <label for="my-drawer" class="btn btn-ghost text-white" aria-label="Fermer le menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
          <span class="sr-only">Fermer</span>
        </label>
      </div>
      <nav aria-label="Navigation mobile">
        <ul class="menu text-white space-y-4 pt-4">
          <li><a routerLink="/visiteur/home" routerLinkActive="active" class="text-white hover:text-pink-100 transition-colors duration-200
          font-['Sansita',sans-serif] focus:outline-2 focus:outline-white focus:outline-offset-2">Accueil</a></li>
          <li><a routerLink="/visiteur/programme" routerLinkActive="active" class="text-white hover:text-pink-100 transition-colors duration-200
          font-['Sansita',sans-serif] focus:outline-2 focus:outline-white focus:outline-offset-2">Programme</a></li>
          <li><a routerLink="/visiteur/map" routerLinkActive="active" class="text-white hover:text-pink-100 transition-colors duration-200
          font-['Sansita',sans-serif] focus:outline-2 focus:outline-white focus:outline-offset-2">Map</a></li>
          <li><a routerLink="/visiteur/faq" routerLinkActive="active" class="text-white hover:text-pink-100 transition-colors duration-200
          font-['Sansita',sans-serif] focus:outline-2 focus:outline-white focus:outline-offset-2">FAQ</a></li>
        </ul>
      </nav>
    </div>
  </div>
</div>

<style>
  /* S'assurer que le focus est visible */
  a:focus, button:focus, [role="button"]:focus {
    @apply outline outline-2 outline-white outline-offset-2;
  }

  /* Pour les utilisateurs qui préfèrent réduire les mouvements */
  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001s !important;
      transition-duration: 0.001s !important;
    }
  }
</style>
