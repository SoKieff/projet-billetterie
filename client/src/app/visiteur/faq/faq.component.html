<div class="w-full bg-gradient-to-b from-pink-50 to-purple-50 p-4 rounded-lg shadow-lg font-sans min-h-screen">
  <h1 class="text-4xl font-bold text-center bg-gradient-to-r from-pink-500 to-purple-500 text-transparent bg-clip-text mb-6">Foire aux questions</h1>

  <div class="max-w-3xl mx-auto">
    <!-- Filtres/Catégories de questions -->
    <div class="flex flex-wrap gap-2 justify-center mb-6">
      <button
        *ngFor="let category of categories"
        (click)="filterByCategory(category)"
        [ngClass]="{
          'bg-pink-200 text-pink-900': selectedCategory === category,
          'bg-opacity-20 text-pink-900 bg-pink-100': selectedCategory !== category
        }"
        class="btn btn-sm border-none transition-all duration-200 hover:bg-pink-300 hover:text-pink-900">
        {{ category }}
      </button>
      <button
        (click)="filterByCategory('Toutes')"
        [ngClass]="{
          'bg-pink-200 text-pink-900': selectedCategory === 'Toutes',
          'bg-opacity-20 text-pink-900 bg-pink-100': selectedCategory !== 'Toutes'
        }"
        class="btn btn-sm border-none transition-all duration-200 hover:bg-pink-300 hover:text-pink-900">
        Toutes
      </button>
    </div>

    <!-- Liste des questions -->
    <div class="space-y-4 bg-white bg-opacity-80 p-6 rounded-lg shadow-md">
      <div *ngFor="let item of filteredFaqItems" class="collapse collapse-arrow bg-pink-100 rounded-lg mb-3 overflow-hidden transition-all duration-300">
        <input type="checkbox" />
        <div class="collapse-title text-lg font-medium text-pink-900 hover:bg-pink-200 hover:bg-opacity-30 transition-all duration-200">
          {{ item.question }}
        </div>
        <div class="collapse-content bg-white bg-opacity-70 transition-all duration-300 ease-in-out">
          <p [innerHTML]="item.answer" class="text-pink-950"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Section Partenaires -->
  <div class="w-full pt-8 pb-12 mt-8 relative">
    <div class="absolute left-1/2 transform -translate-x-1/2 top-0 w-3/5 h-0.5 bg-white bg-opacity-30 rounded"></div>

    <h2 class="text-4xl font-bold text-center bg-gradient-to-r from-pink-500 to-purple-500 text-transparent bg-clip-text mb-6">Nos Partenaires</h2>

    <!-- Catégories de partenaires -->
    <div class="mb-12">
      <h3 class="text-xl font-bold text-center bg-gradient-to-r from-pink-500 to-purple-500 text-transparent bg-clip-text mb-6">Partenaires Officiels</h3>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 justify-items-center">
        <div *ngFor="let partner of officialPartners" class="transition-all duration-300 hover:-translate-y-1">
          <div class="bg-white bg-opacity-90 rounded-lg p-4 h-24 w-36 flex items-center justify-center shadow-md transition-transform hover:scale-105">
            <img [src]="'/assets/images/logos/' + partner.logo" [alt]="partner.name" class="max-h-16 max-w-full">
          </div>
          <p class="text-center text-pink-400 mt-2 text-sm">{{partner.name}}</p>
        </div>
      </div>
    </div>

    <div class="mb-12">
      <h3 class="text-xl font-bold text-center bg-gradient-to-r from-pink-500 to-purple-500 text-transparent bg-clip-text mb-6">Partenaires Médias</h3>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 justify-items-center">
        <div *ngFor="let partner of mediaPartners" class="transition-all duration-300 hover:-translate-y-1">
          <div class="bg-white bg-opacity-90 rounded-lg p-4 h-24 w-36 flex items-center justify-center shadow-md transition-transform hover:scale-105">
            <img [src]="'/assets/images/logos/' + partner.logo" [alt]="partner.name" class="max-h-16 max-w-full">
          </div>
          <p class="text-center text-pink-400 mt-2 text-sm">{{partner.name}}</p>
        </div>
      </div>
    </div>

    <div>
      <h3 class="text-xl font-bold text-center bg-gradient-to-r from-pink-500 to-purple-500 text-transparent bg-clip-text mb-6">Partenaires Locaux</h3>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 justify-items-center">
        <div *ngFor="let partner of localPartners" class="transition-all duration-300 hover:-translate-y-1">
          <div class="bg-white bg-opacity-90 rounded-lg p-4 h-24 w-36 flex items-center justify-center shadow-md transition-transform hover:scale-105">
            <img [src]="'/assets/images/logos/' + partner.logo" [alt]="partner.name" class="max-h-16 max-w-full">
          </div>
          <p class="text-center text-pink-400 mt-2 text-sm">{{partner.name}}</p>
        </div>
      </div>
    </div>

    <div>
      <h3 class="text-xl font-bold text-center bg-gradient-to-r from-pink-500 to-purple-500 text-transparent bg-clip-text mb-6">Réseaux Sociaux</h3>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 justify-items-center">
        <div *ngFor="let socials of socialNetworks" class="transition-all duration-300 hover:-translate-y-1">
          <div class="bg-white bg-opacity-90 rounded-lg p-4 h-24 w-36 flex items-center justify-center shadow-md transition-transform hover:scale-105">
            <img [src]="'/assets/images/logos/' + socials.logo" [alt]="socials.name" class="max-h-16 max-w-full">
          </div>
          <p class="text-center text-pink-400 mt-2 text-sm">{{socials.name}}</p>
        </div>
      </div>
    </div>
  </div>
</div>
