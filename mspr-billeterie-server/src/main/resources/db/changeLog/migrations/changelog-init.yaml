databaseChangeLog:
  - changeSet:
      id: 1
      author: Solveig
      comment: "Création des tables initiales"
      changes:
        - createTable:
            tableName: artiste
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nom
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: url_artist_image
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: url_social_media
                  type: varchar(255)
                  constraints:
                    nullable: true

        - createTable:
            tableName: scene
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false

        - createTable:
            tableName: evenement
            columns:
              - column:
                  name: event_id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_name
                  type: varchar(255)
              - column:
                  name: start_time
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: long_description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: artiste_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: scene_id
                  type: int
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: evenement
            baseColumnNames: artiste_id
            referencedTableName: artiste
            referencedColumnNames: id
            constraintName: fk_evenement_artiste

        - addForeignKeyConstraint:
            baseTableName: evenement
            baseColumnNames: scene_id
            referencedTableName: scene
            referencedColumnNames: id
            constraintName: fk_evenement_scene
