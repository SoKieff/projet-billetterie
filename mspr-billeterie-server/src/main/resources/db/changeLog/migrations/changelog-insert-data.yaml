              - column:
                  name: longDescription
                  value: "QUANTUM BEATS repousse les frontières du rock progressif japonais avec leurs compositions complexes et leur approche innovante de la structure musicale. Formé par d'anciens musiciens de session, ce groupe de quatre virtuoses se distingue par des morceaux aux changements de rythme audacieux et aux harmonies sophistiquées. Leur son caractéristique mêle instruments traditionnels comme le koto électrique à des synthétiseurs analogiques et des guitares aux effets travaillés. Les paroles, souvent inspirées de concepts scientifiques et philosophiques, ajoutent une dimension intellectuelle à leur musique déjà techniquement impressionnante. Leur performance au festival mettra en avant l'intégralité de leur album concept \"Temporal Paradox\"."
