                  name: event_id
                  valueNumeric: 8
              - column:
                  name: event_name
                  value: "Ateliers de cosplay"
              - column:
                  name: start_time
                  valueDate: "2025-09-27 15:00:00"
              - column:
                  name: end_time
                  valueDate: "2025-09-27 23:00:00"
              - column:
                  name: description
                  value: "Apprenez à créer vos propres costumes"
              - column:
                  name: longDescription
                  value: "Les ateliers de cosplay offrent une opportunité unique d'apprendre les techniques professionnelles de création de costumes avec des experts reconnus. Des sessions sont proposées pour tous les niveaux, du débutant à l'avancé, avec des focus sur différentes techniques comme le travail des tissus, la création d'accessoires en mousse ou l'utilisation de l'électronique pour des costumes interactifs."
              - column:
                  name: categorie
                  value: "ATELIER"
              - column:
                  name: artiste_id
                  valueNumeric: 8
              - column:
                  name: scene_id
                  valueNumeric: 3

        - insert:
            tableName: evenement
            columns:
              - column:
                  name: event_id
                  valueNumeric: 9
              - column:
                  name: event_name
                  value: "Zone de karaoké nocturne"
              - column:
                  name: start_time
                  valueDate: "2025-09-27 15:00:00"
              - column:
                  name: end_time
                  valueDate: "2025-09-27 23:00:00"
              - column:
                  name: description
                  value: "Chantez vos génériques d'anime préférés"
              - column:
                  name: longDescription
                  value: "Animée par TokyoTunes, la Zone de karaoké nocturne est l'endroit idéal pour libérer votre voix intérieure sur vos génériques d'anime et J-pop préférés ! Aménagée comme un véritable karaoké japonais avec des salles semi-privées aux thématiques variées (Ghibli, Shonen, Retro Anime, J-pop moderne), cette zone propose une collection de plus de 1000 chansons en japonais et en version multilingue. Un système de réservation permet de garantir à chacun un temps de chant, et des mini-concours auront lieu toutes les heures avec des prix à gagner. Les participants les plus talentueux pourront être sélectionnés pour une performance spéciale sur la petite scène de la Kawaii Zone en fin de soirée."
              - column:
                  name: categorie
                  value: "ANIMATION"
              - column:
                  name: artiste_id
                  valueNumeric: 9
              - column:
                  name: scene_id
                  valueNumeric: 3

        - insert:
            tableName: evenement
            columns:
              - column:
                  name: event_id
                  valueNumeric: 10
              - column:
                  name: event_name
                  value: "Boutiques de merchandising officiel"
              - column:
                  name: start_time
                  valueDate: "2025-09-27 15:00:00"
              - column:
                  name: end_time
                  valueDate: "2025-09-27 23:00:00"
              - column:
                  name: description
                  value: "Goodies et produits dérivés"
              - column:
                  name: longDescription
                  value: "L'espace boutiques de merchandising officiel regroupe une sélection exclusive de produits dérivés des artistes présents au festival ainsi que des articles spécialement conçus pour l'événement Sakura Nights. Ces stands proposent une large gamme de goodies allant des t-shirts, hoodies et tote bags aux accessoires plus collectionnables comme des pins, porte-clés, lithographies numérotées et éditions limitées de CD/vinyles. Chaque artiste du festival disposera d'un espace dédié, et une collection capsule \"Sakura Nights 2024\" conçue par des illustrateurs japonais renommés sera disponible en exclusivité. Un service de pré-commande est également disponible pour les articles les plus demandés."
              - column:
                  name: categorie
                  value: "SHOPPING"
              - column:
                  name: artiste_id
                  valueNumeric: 10
              - column:
                  name: scene_id
                  valueNumeric: 3

        - insert:
            tableName: evenement
            columns:
              - column:
                  name: event_id
                  valueNumeric: 11
              - column:
                  name: event_name
                  value: "DJ Sets"
              - column:
                  name: start_time
                  valueDate: "2025-09-27 23:00:00"
              - column:
                  name: end_time
                  valueDate: "2025-09-28 01:30:00"
              - column:
                  name: description
                  value: "Avec DJ BLOSSOM et DJ NEKO"
              - column:
                  name: longDescription
                  value: "La nuit se transforme en véritable dance floor avec les DJ sets électrisants de DJ BLOSSOM et DJ NEKO. DJ BLOSSOM (Yumi Tanaka), reconnue pour ses mélanges audacieux de J-pop, future bass et house japonaise, propose une ambiance festive et colorée qui capture l'essence du Harajuku contemporain. DJ NEKO (Kenji Sato), spécialiste des remixes d'anime et de city pop, apporte une touche nostalgique avec des transitions fluides entre différentes époques musicales japonaises. Les deux artistes alterneront des sessions de 45 minutes, créant une progression musicale parfaite pour danser jusqu'au petit matin. Des danseurs professionnels interviendront ponctuellement pour des performances chorégraphiées, ajoutant une dimension visuelle à cette expérience sonore."
              - column:
                  name: categorie
                  value: "DJ SET"
              - column:
                  name: artiste_id
                  valueNumeric: 11
              - column:
                  name: scene_id
                  valueNumeric: 3

        - insert:
            tableName: evenement
            columns:
              - column:
                  name: event_id
                  valueNumeric: 12
              - column:
                  name: event_name
                  value: "Night Market"
              - column:
                  name: start_time
                  valueDate: "2025-09-27 21:00:00"
              - column:
                  name: end_time
                  valueDate: "2025-09-28 01:30:00"
              - column:
                  name: description
                  value: "Stands de cuisine japonaise et animations LED"
              - column:
                  name: longDescription
                  value: "Le Night Market offre une expérience culinaire authentique avec plus de 20 stands proposant des spécialités japonaises traditionnelles et modernes. Dans une ambiance nocturne enchantée par des installations LED et des projections mapping, vous pourrez déguster des takoyaki, ramen, sushi, mochi et bien d'autres délices tout en profitant d'animations culturelles interactives."
              - column:
                  name: categorie
                  value: "FOOD"
              - column:
                  name: artiste_id
                  valueNumeric: 12
              - column:
                  name: scene_id
                  valueNumeric: 3

        - insert:
            tableName: evenement
            columns:
              - column:
                  name: event_id
                  valueNumeric: 19
              - column:
                  name: event_name
                  value: "Défilé de mode Harajuku"
              - column:
                  name: start_time
                  valueDate: "2025-09-28 15:00:00"
              - column:
                  name: end_time
                  valueDate: "2025-09-28 23:00:00"
              - column:
                  name: description
                  value: "Tendances et styles japonais"
              - column:
                  name: longDescription
                  value: "Le Défilé de mode Harajuku est une célébration vibrante des styles vestimentaires uniques qui ont fait la renommée de ce quartier tokyoïte. Organisé plusieurs fois dans la journée (16h, 18h, 20h), ce défilé met en vedette aussi bien des mannequins professionnels que des influenceurs et des participants au festival sélectionnés pour leur style original. Chaque session explore une facette différente de la mode Harajuku : le premier défilé présente les styles classiques (Lolita, Visual Kei, Decora), le second se concentre sur les tendances contemporaines, et le défilé final explore les créations avant-gardistes de jeunes designers japonais émergents. Entre les défilés, des ateliers de maquillage et de stylisme permettent aux festivaliers d'explorer ces esthétiques uniques et de recevoir des conseils personnalisés pour adapter ces styles à leur propre garde-robe."
              - column:
                  name: categorie
                  value: "ANIMATION"
              - column:
                  name: artiste_id
                  valueNumeric: 19
              - column:
                  name: scene_id
                  valueNumeric: 3

        - insert:
            tableName: evenement
            columns:
              - column:
                  name: event_id
                  valueNumeric: 20
              - column:
                  name: event_name
                  value: "Photo booth style purikura"
              - column:
                  name: start_time
                  valueDate: "2025-09-28 15:00:00"
              - column:
                  name: end_time
                  valueDate: "2025-09-28 23:00:00"
              - column:
                  name: description
                  value: "Photos stylisées à la japonaise"
              - column:
                  name: longDescription
                  value: "L'expérience Photo booth style purikura transpose l'incontournable phénomène des cabines photographiques japonaises au festival Sakura Nights. Bien plus qu'un simple photomaton, ces installations offrent une expérience complète de personnalisation avec des filtres kawaii, des décorations virtuelles et des effets d'embellissement typiquement japonais. Quatre cabines thématiques sont disponibles, chacune proposant un univers différent : \"Tokyo Neon Dreams\", \"Kawaii Paradise\", \"Anime Legends\" et \"Sakura Fantasy\". Après la séance photo, les participants peuvent décorer numériquement leurs clichés sur des bornes tactiles avec des centaines de stickers virtuels, modifier les couleurs et ajouter du texte personnalisé. Les photos peuvent être imprimées instantanément en format autocollant traditionnel purikura ou envoyées numériquement par email et partagées directement sur les réseaux sociaux avec le hashtag #SakuraNights2024."
              - column:
                  name: categorie
                  value: "ANIMATION"
              - column:
                  name: artiste_id
                  valueNumeric: 20
              - column:
                  name: scene_id
                  valueNumeric: 3

        - insert:
            tableName: evenement
            columns:
              - column:
                  name: event_id
                  valueNumeric: 21
              - column:
                  name: event_name
                  value: "Meet & greet avec artistes"
              - column:
                  name: start_time
                  valueDate: "2025-09-28 15:00:00"
              - column:
                  name: end_time
                  valueDate: "2025-09-28 23:00:00"
              - column:
                  name: description
                  value: "Sur tirage au sort"
              - column:
                  name: longDescription
                  value: "Les sessions Meet & greet offrent aux fans une opportunité rare de rencontrer leurs artistes préférés dans un cadre intime et privilégié. Fonctionnant sur un système de tirage au sort pour garantir l'équité, ces rencontres sont organisées dans un espace spécialement aménagé de la Kawaii Zone. Chaque session dure environ 20 minutes et permet à un groupe de 10 fans de discuter avec les artistes, prendre des photos et faire dédicacer un article. Pour participer, les festivaliers doivent scanner leur bracelet à la borne dédiée avant 16h chaque jour, et les gagnants reçoivent une notification sur l'application du festival. Un calendrier détaillé des artistes disponibles est affiché à l'entrée de la zone. Des interprètes japonais-français sont présents pour faciliter les échanges, et un photographe professionnel immortalise ces moments uniques avec des clichés téléchargeables gratuitement après l'événement."
              - column:
                  name: categorie
                  value: "RENCONTRE"
              - column:
                  name: artiste_id
                  valueNumeric: 21
              - column:
                  name: scene_id
                  valueNumeric: 3

        - insert:
            tableName: evenement
            columns:
              - column:
                  name: event_id
                  valueNumeric: 22
              - column:
                  name: event_name
                  value: "Night Market"
              - column:
                  name: start_time
                  valueDate: "2025-09-28 21:00:00"
              - column:
                  name: end_time
                  valueDate: "2025-09-29 01:30:00"
              - column:
                  name: description
                  value: "Stands de cuisine japonaise et animations LED"
              - column:
                  name: longDescription
                  value: "Le Night Market offre une expérience culinaire authentique avec plus de 20 stands proposant des spécialités japonaises traditionnelles et modernes. Dans une ambiance nocturne enchantée par des installations LED et des projections mapping, vous pourrez déguster des takoyaki, ramen, sushi, mochi et bien d'autres délices tout en profitant d'animations culturelles interactives. Chaque stand est tenu par des chefs spécialisés, dont certains venus directement du Japon pour l'occasion. En plus de la nourriture, des démonstrations culinaires sont programmées toutes les heures, permettant de découvrir les techniques de préparation traditionnelles. Une section \"Tokyo Street Food\" reconstitue l'ambiance des ruelles commerçantes japonaises, tandis qu'un espace \"Desserts Kawaii\" propose des pâtisseries et glaces aux présentations artistiques dignes d'Instagram. Des options végétariennes, véganes et sans gluten sont disponibles à presque tous les stands."
              - column:
                  name: categorie
                  value: "FOOD"
              - column:
                  name: artiste_id
                  valueNumeric: 12
              - column:
                  name: scene_id
                  valueNumeric: 3

        # Insertion des événements sans event_name (nom correspond au nom de l'artiste)
        - insert:
            tableName: evenement
            columns:
              - column:
                  name: event_id
                  valueNumeric: 2
              - column:
                  name: start_time
                  valueDate: "2025-09-27 16:00:00"
              - column:
                  name: end_time
                  valueDate: "2025-09-27 17:00:00"
              - column:
                  name: description
                  value: "Fusion metal-idol avec chorégraphies LED"
              - column:
                  name: longDescription
                  value: "CYBER SHRINE est un groupe fusion metal-idol composé de 5 membres qui mélange des éléments de metal, de musique traditionnelle japonaise et de pop électronique. Leurs performances sont visuellement époustouflantes grâce à leurs costumes équipés de LEDs synchronisées avec leur musique. Pour cette performance exclusive, ils présenteront leur nouvel album \"Digital Ancestors\"."
              - column:
                  name: categorie
                  value: "CONCERT"
              - column:
                  name: artiste_id
                  valueNumeric: 2
              - column:
                  name: scene_id
                  valueNumeric: 2

