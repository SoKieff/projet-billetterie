                  value: "Performance de tambours taiko"
              - column:
                  name: longDescription
                  value: "La cérémonie d'ouverture du festival Sakura Nights débutera par une performance spectaculaire de tambours taiko traditionnels. Le groupe Kodo, reconnu mondialement, présentera une chorégraphie spécialement conçue pour l'événement, mélangeant rythmes ancestraux et arrangements contemporains."
