                  value: "RAINBOW VOLTAGE est un groupe pop-rock japonais qui s'est fait connaître en composant des génériques d'anime populaires. Leur style unique fusionne des mélodies accrocheuses de J-pop avec des arrangements rock énergiques et des références musicales aux bandes sonores d'anime classiques. Le quatuor, mené par la chanteuse Haruka avec sa voix puissante et expressive, est célèbre pour ses performances interactives où le public est invité à participer à des chorégraphies simples sur certains refrains. Pour ce festival, RAINBOW VOLTAGE présentera leurs titres les plus populaires ainsi que leur nouveau single \"Colorful Dreams\" qui sortira le mois prochain."
