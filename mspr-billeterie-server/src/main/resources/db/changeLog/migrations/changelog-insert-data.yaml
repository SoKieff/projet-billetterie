              - column:
                  name: description
                  value: "Rock alternatif avec influences traditionnelles"
              - column:
                  name: longDescription
                  value: "NEON SAMURAI est un groupe de rock alternatif qui intègre des instruments traditionnels japonais dans une musique résolument moderne. Leur son unique se caractérise par l'utilisation du shamisen électrique mêlé à des guitares puissantes et des rythmiques dynamiques. Le groupe est connu pour ses performances énergiques qui racontent des histoires inspirées de légendes japonaises revisitées dans un contexte futuriste."
