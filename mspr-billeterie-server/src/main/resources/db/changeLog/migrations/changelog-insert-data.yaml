              - column:
                  name: description
                  value: "Pop orchestrale et électronique"
              - column:
                  name: longDescription
                  value: "PIXEL DREAMS est un projet musical unique qui fusionne la musique orchestrale avec des productions électroniques modernes. Dirigé par le compositeur Akira Yamaoka, le projet présente des arrangements somptueux de chansons d'anime populaires ainsi que des compositions originales inspirées par l'esthétique des jeux vidéo rétro. Pour ce concert, un orchestre de chambre accompagnera les séquences électroniques, créant une expérience immersive entre nostalgie et innovation."
              - column:
                  name: categorie
                  value: "CONCERT"
