image: node:latest

cache:
  paths:
    - client/node_modules/

pages:
  stage: deploy
  script:
    - cd client
    - npm install
    - npm run build -- --prod --base-href="./"
    - cd ..
    - mkdir -p public
    - cp -r client/dist/*/. public/
  artifacts:
    paths:
      - public
  only:
    - master